version: 2

project_name: pulse

builds:
  - main: .
    binary: pulse
    ldflags:
      - -s -w
      - -X github.com/samuelbailey123/pulse/cmd.Version={{.Version}}
      - -X github.com/samuelbailey123/pulse/cmd.Commit={{.ShortCommit}}
      - -X github.com/samuelbailey123/pulse/cmd.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
